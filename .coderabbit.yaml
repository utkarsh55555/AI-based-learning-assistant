language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!build/**"
    - "!.vercel/**"
    - "!.vscode/**"
    - "!tempCodeRunnerFile.*"
    - "!*.exe"
    - "!package-lock.json"
    - "!public/frames/**"
